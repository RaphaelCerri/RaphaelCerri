<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Raphael Caveagna, AI Engineer and AI Solutions Architect</title>
  <desc id="desc">Animated network of evidence, evaluation and governed AI systems.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.5" stop-color="#0b1830"/>
      <stop offset="1" stop-color="#10142b"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#35d6ff"/>
      <stop offset="0.5" stop-color="#8b7cff"/>
      <stop offset="1" stop-color="#42f5b3"/>
    </linearGradient>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M38 0H0V38" fill="none" stroke="#8ab4ff" stroke-opacity="0.065"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .path { stroke-dasharray: 12 14; animation: flow 9s linear infinite; }
      .path.slow { animation-duration: 14s; animation-direction: reverse; }
      .node { animation: pulse 3.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .node.n2 { animation-delay: .8s; }
      .node.n3 { animation-delay: 1.6s; }
      .node.n4 { animation-delay: 2.4s; }
      .cursor { animation: blink 1.1s step-end infinite; }
      @keyframes flow { to { stroke-dashoffset: -260; } }
      @keyframes pulse { 0%,100% { opacity:.5; transform:scale(.86) } 50% { opacity:1; transform:scale(1.18) } }
      @keyframes blink { 50% { opacity:0 } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="24" fill="url(#grid)"/>

  <g fill="none" stroke="url(#signal)" stroke-width="2" opacity=".42">
    <path class="path" d="M30 235C180 155 260 285 420 205S715 85 870 175s220 72 300-5"/>
    <path class="path slow" d="M15 91c170 78 245-30 390 52s260 77 385 5 242-81 395 5"/>
  </g>

  <g fill="#07111f" stroke="url(#signal)" stroke-width="3" filter="url(#glow)">
    <circle class="node" cx="110" cy="196" r="8"/>
    <circle class="node n2" cx="347" cy="238" r="7"/>
    <circle class="node n3" cx="838" cy="159" r="8"/>
    <circle class="node n4" cx="1085" cy="207" r="7"/>
  </g>

  <g text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif">
    <text x="600" y="132" fill="#f5f8ff" font-size="52" font-weight="700" letter-spacing="1">Raphael Caveagna</text>
    <text x="600" y="178" fill="url(#signal)" font-size="22" font-weight="600" letter-spacing="4">AI ENGINEER · AI SOLUTIONS ARCHITECT</text>
    <text x="600" y="220" fill="#aebbd3" font-size="17" letter-spacing="1.2">RAG evaluation · MCP tool systems · governed agents · reliable delivery</text>
    <rect class="cursor" x="1027" y="204" width="2" height="20" fill="#42f5b3"/>
  </g>

  <g font-family="Consolas, monospace" font-size="12" fill="#6f809e">
    <text x="42" y="52">evidence://retrieval/validated</text>
    <text x="925" y="287">authority != execution</text>
  </g>
</svg>
